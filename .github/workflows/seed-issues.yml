name: Seed demo issues
# Add this file at .github/workflows/seed-issues.yml and erp_cutover_issues.json at the repo root.
# Runs once when both are pushed (or manually from the Actions tab). Delete the workflow afterwards.

on:
  push:
    paths:
      - erp_cutover_issues.json
      - .github/workflows/seed-issues.yml
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('erp_cutover_issues.json', 'utf8'));
            const { owner, repo } = context.repo;

            // Labels
            for (const [name, color, description] of data.labels) {
              try { await github.rest.issues.createLabel({ owner, repo, name, color, description }); core.info(`label ${name}`); }
              catch (e) { if (e.status !== 422) throw e; core.info(`label ${name} exists`); }
            }

            // Milestones
            const existing = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all' });
            const ms = Object.fromEntries(existing.map(m => [m.title, m.number]));
            for (const [title, due] of data.milestones) {
              if (ms[title]) continue;
              const r = await github.rest.issues.createMilestone({ owner, repo, title, due_on: `${due}T00:00:00Z` });
              ms[title] = r.data.number; core.info(`milestone ${title}`);
            }

            // Issues — skip titles that already exist so re-runs are safe
            const have = new Set((await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 }))
              .filter(i => !i.pull_request).map(i => i.title));
            let created = 0;
            for (const it of data.issues) {
              if (have.has(it.title)) continue;
              const dates = `\n\n---\nOpened ${it.created}` + (it.closed ? ` · Closed ${it.closed}` : ' · Open');
              const r = await github.rest.issues.create({ owner, repo, title: it.title, body: (it.body || '') + dates,
                labels: it.labels, milestone: ms[it.milestone] });
              if (it.closed) await github.rest.issues.update({ owner, repo, issue_number: r.data.number, state: 'closed', state_reason: 'completed' });
              created++; core.info(`#${r.data.number} ${it.closed ? 'closed' : 'open'} ${it.title}`);
              await new Promise(res => setTimeout(res, 800)); // stay well under secondary rate limits
            }
            core.info(`done: ${created} issues created`);
